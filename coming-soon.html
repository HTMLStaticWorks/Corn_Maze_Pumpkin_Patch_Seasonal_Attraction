<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Harvest Haven</title>
    <meta name="description" content="We're preparing the most magical seasonal experience yet. Join our mailing list!">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-primary d-flex align-items-center justify-content-center min-vh-100 p-4 overflow-hidden position-relative">

    <!-- Theme Toggle -->
    <div class="position-absolute top-0 end-0 p-4 d-flex gap-2">
        <button id="rtl-toggle" class="btn">RTL</button>
        <button id="theme-toggle" class="btn">
            <i class="bi bi-moon-stars-fill theme-icon fs-4"></i>
        </button>
    </div>

    <!-- Decor -->
    <div class="position-absolute top-0 start-0 w-100 h-100 z-0">
        <div class="position-absolute top-0 start-0 w-25 h-25 bg-white opacity-10 rounded-circle translate-middle"></div>
        <div class="position-absolute bottom-0 end-0 w-25 h-25 bg-dark opacity-10 rounded-circle translate-middle"></div>
    </div>

    <div class="card border-0 shadow-lg rounded-5 p-5 p-md-5 text-center position-relative z-1" style="max-width: 800px; width: 100%;">
        <div class="mb-5">
            <img src="assets/images/logo.svg" alt="Harvest Haven Logo" height="50">
        </div>
        
        <h1 class="display-3 fw-bold mb-4">The Harvest is <span class="text-primary">Ripening...</span></h1>
        <p class="lead text-muted mb-5">We're preparing the most magical seasonal experience yet. Join our mailing list to be the first to know when the gates open!</p>
        
        <form class="row g-3 mb-5 justify-content-center">
            <div class="col-md-8">
                <input type="email" class="form-control form-control-lg bg-light border-0 rounded-pill px-4 py-3" placeholder="Email address">
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill py-3">Notify Me</button>
            </div>
        </form>
        
        <div class="d-flex justify-content-center gap-4">
            <a href="#" class="btn btn-outline-primary rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;"><i class="bi bi-facebook fs-5"></i></a>
            <a href="#" class="btn btn-outline-primary rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;"><i class="bi bi-instagram fs-5"></i></a>
            <a href="#" class="btn btn-outline-primary rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;"><i class="bi bi-twitter-x fs-5"></i></a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
